<style>
.community-page { width: 100%; max-width: none; margin: 0; padding: 8px 24px 40px 4px; }

}

.community-stat-main .stat-label, .community-stat-main .stat-note { display: block; font-size: .76rem; opacity: .88; }

.community-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.community-feed-head h2 { margin: 4px 0 0; font-size: 1.35rem; }

.live-indicator i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
.community-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 3px 0 12px; margin-bottom: 6px; scrollbar-width: none; }
.community-tabs::-webkit-scrollbar { display: none; }
.community-tab { white-space: nowrap; text-decoration: none; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); color: var(--text-muted); font-size: .8rem; font-weight: 700; }

.community-notice { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

.community-sidebar { display: grid; gap: 16px; position: sticky; top: 88px; }

.reward-list { display: grid; gap: 8px; }

/* Social feed cards */
.hl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow-sm); transition: box-shadow .2s var(--ease), transform .2s var(--ease); }

.hl-product { display: flex; align-items: center; gap: 12px; width: calc(50% - 24px); min-height: 76px; box-sizing: border-box; margin: 0 16px 12px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: inherit; text-decoration: none; overflow: hidden; }

.hl-product > div { min-width: 0; flex: 1 1 auto; overflow: hidden; }

.hl-product .meta { font-size: .66rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-media { width: 100%; max-height: 520px; object-fit: cover; background: var(--bg); display: block; }
.hl-body { padding: 14px 16px 8px; }
.hl-body h5 { font-size: 1rem; font-weight: 800; margin-bottom: 7px; }
.hl-body p { color: var(--text-muted); line-height: 1.65; margin: 0; font-size: .84rem; }
.hl-progress-box { margin: 8px 16px 4px; padding: 11px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.hl-progress-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: .74rem; margin-bottom: 7px; }
.hl-progress-top .pts { font-weight: 800; }
.hl-progress-top .goal { color: var(--text-muted); }
.hl-bar { height: 7px; background: var(--border); border-radius: var(--radius-pill); overflow: hidden; }
.hl-bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--warning), var(--success)); transition: width .5s var(--ease); }
.hl-voucher { display: none; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; padding: 8px 10px; background: var(--warning-bg); border: 1px dashed rgba(245,158,11,.45); border-radius: var(--radius-sm); }

.hl-actions { display: flex; gap: 6px; padding: 10px 16px 14px; }
.hl-act { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text-muted); border-radius: var(--radius-sm); padding: 7px 9px; font-size: .76rem; font-weight: 700; cursor: pointer; }
.hl-act:hover { background: var(--info-bg); color: var(--primary); }
.hl-act.liked { color: var(--danger); background: var(--danger-bg); }

.hl-comments { padding: 0 16px 16px; display: none; }
.hl-comments.open { display: block; }
.hl-comment { display: flex; gap: 9px; padding: 9px 0; border-top: 1px solid var(--border); }
.hl-comment img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }

.hl-comment .txt { font-size: .8rem; color: var(--text-muted); margin: 2px 0 0; }

.community-empty { text-align: center; padding: 56px 20px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface); }

}
@media (max-width: 575px) {
