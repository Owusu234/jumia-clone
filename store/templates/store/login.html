{% extends "store/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="bg-white rounded p-4 shadow-sm">
            <h4 class="text-center fw-bold mb-4" style="color:var(--p)">Welcome Back</h4>
            
            <!-- Email/Password Login -->
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small">Email</label>
                    <input type="email" name="username" class="form-control" placeholder="your@email.com" required>
                    <small class="text-muted">Use the email you registered with</small>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Password</label>
                    <div class="position-relative">
                        <input type="password" name="password" id="loginPassword" class="form-control" placeholder="Your password" required>
                        <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted" 
                                onclick="togglePassword('loginPassword', this)" style="text-decoration:none;z-index:10">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mt-2 py-2">Login with Email</button>
            </form>
            
            <p class="text-center mt-3 small">
                Don't have an account? <a href="{% url 'store:register' %}" class="fw-bold">Register</a>
            </p>

            <div class="text-center mt-3">
                <a href="{% url 'store:forgot_password' %}" class="small text-muted">Forgot password?</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
