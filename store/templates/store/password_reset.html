{% extends "store/base.html" %}
{% block title %}Reset Password | ShopVibe{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-3 text-center">🔐 Set New Password</h3>
                    
                    <div id="loading" class="text-center py-3">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Verifying reset link...</p>
                    </div>
                    
                    <form id="reset-form" style="display: none;">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="password" id="new-pass" class="form-control" required minlength="8">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="password2" id="confirm-pass" class="form-control" required>
                        </div>
                        <div id="error-msg" class="alert alert-danger d-none small"></div>
                        <button type="submit" class="btn btn-primary w-100">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Extract access_token from URL hash (Supabase recovery link)
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    if (!accessToken) {
        document.getElementById('loading').innerHTML = 
            '<div class="alert alert-danger">❌ Invalid or expired reset link.<br><a href="{% url "store:forgot_password" %}">Request a new one</a></div>';
        return;
    }

    // Show form
    document.getElementById('reset-form').style.display = 'block';
    document.getElementById('loading').style.display = 'none';

    // Handle submission
    document.getElementById('reset-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const pass = document.getElementById('new-pass').value;
        const confirm = document.getElementById('confirm-pass').value;
        const errorDiv = document.getElementById('error-msg');
        
        if (pass !== confirm) {
            errorDiv.textContent = "Passwords don't match.";
            errorDiv.classList.remove('d-none');
            return;
        }
        if (pass.length < 8) {
            errorDiv.textContent = "Password must be at least 8 characters.";
            errorDiv.classList.remove('d-none');
            return;
        }

        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';

        try {
            const response = await fetch("{% url 'store:api_reset_password' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({ token: accessToken, password: pass })
            });
            const data = await response.json();
            
            if (data.success) {
                window.location.href = "{% url 'store:login' %}?reset=success";
            } else {
                errorDiv.textContent = data.error || "Reset failed. Please try again.";
                errorDiv.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = 'Update Password';
            }
        } catch (err) {
            errorDiv.textContent = "Network error. Please check your connection.";
            errorDiv.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = 'Update Password';
        }
    });
});
</script>
{% endblock %}
